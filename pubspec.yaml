name: storytale
description: "A local-first EPUB library with DeepL translation, text-to-speech, and sprite-based chapter visualization."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.7.1
  epubx: ^4.0.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  html: ^0.15.6
  http: ^1.6.0
  image: ^3.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/books/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/backgrounds/cloudflare_examples/
    - assets/images/characters/
    - assets/images/characters/references/
    - assets/images/characters/rigs/humanoid_v1/
    - assets/images/characters/rigs/humanoid_v1/base/
    - assets/images/characters/rigs/humanoid_v1/faces/
    - assets/images/characters/rigs/humanoid_v1/poses/
    - assets/images/characters/face_profiles/
    - assets/images/characters/face_profiles/default/
    - assets/images/characters/face_profiles/hero/
    - assets/images/characters/face_profiles/heroine/
    - assets/images/characters/face_profiles/heroine/reference/
    - assets/images/characters/face_profiles/heroine/eyes/
    - assets/images/characters/face_profiles/heroine/noses/
    - assets/images/characters/face_profiles/heroine/mouths/
    - assets/images/characters/face_profiles/elder/
    - assets/images/characters/face_profiles/adult_deep/
    - assets/audio/narration/
    - assets/audio/sfx/
    - assets/models/tts/
    - assets/models/voices/
    - assets/animations/
