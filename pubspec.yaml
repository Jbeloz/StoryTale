name: storytale
description: "A local-first EPUB library with DeepL translation, text-to-speech, and sprite-based chapter visualization."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/books/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/audio/narration/
    - assets/audio/sfx/
    - assets/models/tts/
    - assets/models/voices/
    - assets/animations/
