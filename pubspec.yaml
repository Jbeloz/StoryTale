name: storytale
description: "A local-first EPUB library with DeepL translation, text-to-speech, and sprite-based chapter visualization."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.7.1
  crypto: ^3.0.6
  epubx: ^4.0.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  html: ^0.15.6
  http: ^1.6.0
  image: ^3.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/books/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/backgrounds/cloudflare_examples/
    - assets/images/characters/
    - assets/images/characters/references/
    - assets/images/characters/rigs/humanoid_v1/
    - assets/images/characters/rigs/humanoid_v1/base/
    - assets/images/characters/rigs/humanoid_v1/faces/
    - assets/images/characters/rigs/humanoid_v1/hair/
    - assets/images/characters/rigs/humanoid_v1/poses/
    # V4 was retired on 2026-08-07; V5 generates by part group instead. V1 stays
    # registered until V5-3 proves the new path, as the documented rollback.
    - assets/images/characters/generation_templates/humanoid_v1/character_sheet_v1/
    # Local stand-in for a generated garment, so the V5 clothing layer can be
    # built and reviewed without a paid request. Not character art.
    - assets/images/characters/garment_fixtures/
    - assets/images/characters/face_profiles/
    - assets/images/characters/face_profiles/default/
    - assets/images/characters/face_profiles/default/reference/
    - assets/images/characters/face_profiles/default/eyes/
    - assets/images/characters/face_profiles/default/noses/
    - assets/images/characters/face_profiles/default/mouths/
    - assets/images/characters/face_profiles/default/details/
    - assets/images/characters/face_profiles/hero/
    - assets/images/characters/face_profiles/hero/reference/
    - assets/images/characters/face_profiles/hero/eyes/
    - assets/images/characters/face_profiles/hero/noses/
    - assets/images/characters/face_profiles/hero/mouths/
    - assets/images/characters/face_profiles/hero/details/
    - assets/images/characters/face_profiles/heroine/
    - assets/images/characters/face_profiles/heroine/reference/
    - assets/images/characters/face_profiles/heroine/eyes/
    - assets/images/characters/face_profiles/heroine/noses/
    - assets/images/characters/face_profiles/heroine/mouths/
    - assets/images/characters/face_profiles/heroine/details/
    - assets/images/characters/face_profiles/elder/
    - assets/images/characters/face_profiles/elder/reference/
    - assets/images/characters/face_profiles/elder/eyes/
    - assets/images/characters/face_profiles/elder/noses/
    - assets/images/characters/face_profiles/elder/mouths/
    - assets/images/characters/face_profiles/elder/details/
    - assets/images/characters/face_profiles/adult_deep/
    - assets/images/characters/face_profiles/adult_deep/reference/
    - assets/images/characters/face_profiles/adult_deep/eyes/
    - assets/images/characters/face_profiles/adult_deep/noses/
    - assets/images/characters/face_profiles/adult_deep/mouths/
    - assets/images/characters/face_profiles/adult_deep/details/
    - assets/audio/narration/
    - assets/audio/sfx/
    - assets/models/tts/
    - assets/models/voices/
    - assets/animations/
