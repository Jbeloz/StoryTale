name: storytale
description: "A local-first EPUB library with DeepL translation, text-to-speech, and sprite-based chapter visualization."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/books/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/audio/narration/
    - assets/audio/sfx/
    - assets/animations/
